<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>DTD Scan-In</title>
<link rel="manifest" href="/scanner/manifest.webmanifest" />
<style>
  :root { --ok:#0a7d3f; --warn:#b45309; --bad:#b91c1c; --ink:#111; --mute:#666; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif; color:var(--ink); }
  header { padding:12px 16px; background:#111; color:#fff; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header p { margin:2px 0 0; font-size:12px; opacity:.75; }
  #video-wrap { position:relative; background:#000; aspect-ratio:4/3; }
  video { width:100%; height:100%; object-fit:cover; }
  #reticle { position:absolute; inset:20% 15%; border:3px solid rgba(255,255,255,.85);
             border-radius:12px; pointer-events:none; }
  #counter { padding:14px 16px; display:flex; align-items:baseline; gap:10px;
             border-bottom:1px solid #eee; }
  #count { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  #of { font-size:18px; color:var(--mute); }
  #status { margin-left:auto; font-size:13px; font-weight:600; }
  #toast { padding:12px 16px; font-weight:600; color:#fff; display:none; }
  #toast.show { display:block; }
  #log { max-height:34vh; overflow:auto; font-size:13px; }
  .row { padding:8px 16px; border-bottom:1px solid #f2f2f2; display:flex; gap:8px; }
  .row .id { font-family:ui-monospace,monospace; }
  .row .tag { margin-left:auto; font-size:11px; font-weight:700; }
  .t-ok { color:var(--ok); } .t-dup { color:var(--warn); } .t-bad { color:var(--bad); }
  footer { padding:12px 16px; display:flex; gap:10px; }
  button { flex:1; padding:14px; font-size:15px; font-weight:600; border:0; border-radius:10px; }
  #finish { background:var(--ok); color:#fff; }
  #manual { background:#eee; }
  #offline { display:none; padding:8px 16px; background:#fde68a; font-size:13px; }
  #offline.show { display:block; }
</style>
</head>
<body>
<header>
  <h1>Scan-in at godown</h1>
  <p id="meta">loading manifest…</p>
</header>

<div id="offline">Offline — scans are queued and will sync automatically.</div>

<div id="video-wrap"><video id="video" playsinline muted></video><div id="reticle"></div></div>

<div id="counter">
  <span id="count">0</span><span id="of">/ 0</span>
  <span id="status">—</span>
</div>

<div id="toast"></div>
<div id="log"></div>

<footer>
  <button id="manual">Enter ID</button>
  <button id="finish">Finish &amp; sign</button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/scanner/scanner.js" type="module"></script>
</body>
</html>
