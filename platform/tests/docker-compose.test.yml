version: "3.8"

services:
  dtd-postgres-test:
    image: postgres:16
    container_name: dtd-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dtd
      POSTGRES_DB: dtd_test
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/rls-policies.sql:/docker-entrypoint-initdb.d/2-rls-policies.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dtd_test"]
      interval: 2s
      timeout: 3s
      retries: 10
